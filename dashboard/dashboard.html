<!DOCTYPE html>
<html>
<head>
    <title>Event Viewer Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <h1 class="title">Event Viewer Toolkit Dashboard</h1>

    <!-- Scenario Buttons -->
    <div class="scenario-buttons">
        <button onclick="loadScenario('bruteforce')">Brute Force</button>
        <button onclick="loadScenario('priv_escalation')">Privilege Escalation</button>
        <button onclick="loadScenario('malware')">Malware</button>
        <button onclick="loadScenario('powershell_attack')">PowerShell Attack</button>
    </div>

    <!-- Cards -->
    <div class="cards">
        <div class="card" id="successfulLogins">Successful Logins: 0</div>
        <div class="card" id="failedLogins">Failed Logins: 0</div>
        <div class="card" id="privEsc">Privilege Escalations: 0</div>
        <div class="card" id="processCreated">Processes Created: 0</div>
    </div>

    <!-- Charts -->
    <div class="chart-container">
        <canvas id="pieChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="barChart"></canvas>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
